[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "and-os-core"
version = "9.5.0"
description = "Deterministic Microkernel & Operating System for Autonomous AI Coding Agents"
readme = "README.md"
authors = [{ name = "Andrey Korenkov" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KornAnd/and-os-core"
Repository = "https://github.com/KornAnd/and-os-core.git"
Issues = "https://github.com/KornAnd/and-os-core/issues"
